[project]
name = "cladder-inspect"
version = "0.1.0"
description = "Inspect implementation of CLadder (Jin et al., NeurIPS 2023): causal reasoning across Pearl's ladder of causation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "inspect-ai>=0.3.200",
    "datasets>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "anthropic",
    "openai",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cladder_inspect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["dataset_download: test downloads the CLadder dataset from Hugging Face"]
